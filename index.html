<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Heart Flow ❤️</title>
<link rel="icon" type="image/x-icon" href="icon/images (1).jpeg">

<style>
body {
  margin: 0;
  overflow: hidden;
  background: black;
  font-family: Arial, sans-serif;
}

/* palavras */
.word {
  position: absolute;
  white-space: nowrap;
  user-select: none;
  color: #ff1a1a; /* vermelho mais forte */
  text-shadow: 0 0 6px #ff0000, 0 0 12px #ff0000; /* glow */
  will-change: transform, opacity;
}

/* msg */
#msg {
  position: fixed;
  margin-left: 50px;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 10;
  color: white;
  background: rgba(255,0,0,0.9);
  padding: 10px 16px;
  border-radius: 20px;
  font-size: 13px;
}
</style>
</head>

<body>

<div id="msg">Toque na tela 💞🎵</div>

<audio id="music" autoplay loop>
  <source src="iloove/Angel - Massive Attack (best part looped).mp3" type="audio/mpeg">
</audio>

<script>
const words = [];

// 🔥 MUITO IMPORTANTE (performance)
const isMobile = window.innerWidth < 600;
const total = isMobile ? 120 : 260; // reduz sem perder formato
const scale = isMobile ? 11 : 17;

function heartPoint(t) {
  let x = 16 * Math.pow(Math.sin(t), 3);
  let y = 13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t);
  return { x: x * scale, y: y * scale };
}

for (let i = 0; i < total; i++) {
  let el = document.createElement("div");
  el.className = "word";
  el.innerText = "I love you ❤️";

  el.style.fontSize = (Math.random() * 6 + (isMobile ? 11 : 13)) + "px";

  document.body.appendChild(el);

  words.push({
    el,
    t: (i / total) * Math.PI * 2,
    speed: 0.0015 + Math.random() * 0.0015,
    fade: Math.random() * Math.PI * 2
  });
}

function animate() {
  const centerX = window.innerWidth / 2;
  const centerY = window.innerHeight / 2;

  for (let i = 0; i < words.length; i++) {
    let p = words[i];

    p.t += p.speed;
    if (p.t > Math.PI * 2) p.t -= Math.PI * 2;

    let pos = heartPoint(p.t);

    let x = centerX + pos.x;
    let y = centerY - pos.y;

    p.el.style.transform = `translate(${x}px, ${y}px)`;

    // fade leve (sem pesar)
    p.fade += 0.03;
    p.el.style.opacity = 0.4 + 0.6 * Math.sin(p.fade);
  }

  requestAnimationFrame(animate);
}

animate();

// música
const music = document.getElementById("music");

window.onload = () => {
  music.play().catch(() => {});
};

document.body.addEventListener("touchstart", () => {
  music.play();
}, { once: true });

document.body.addEventListener("click", () => {
  music.play();
}, { once: true });
</script>

</body>
</html>
